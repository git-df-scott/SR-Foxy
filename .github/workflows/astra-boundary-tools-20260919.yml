name: Astra boundary recovery tools 2026-09-19
on:
  push:
    branches: [main]
    paths: ['.github/workflows/astra-boundary-tools-20260919.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download public pinned topology wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p topology-wheels
          python -m pip download --only-binary=:all: --dest topology-wheels 'snappy==3.3.2'
          (cd topology-wheels && sha256sum *.whl > SHA256SUMS)
          printf '%s\n' 'Public Python wheels for local marked surgery calculation.' 'No repository checkout, secret access, or result mutation.' > topology-wheels/PROVENANCE.txt
      - name: Export original distribution bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-boundary-topology-wheels-cp313
          path: topology-wheels/
          retention-days: 7
          if-no-files-found: error
